kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind-cluster
# featureGates:
#   "GracefulNodeShutdown": true
# runtimeConfig:
#   "api/alpha": "false"
networking:
  apiServerAddress: "192.168.2.96"
  apiServerPort: 6443
  ipFamily: ipv4
  # podSubnet: "10.1.0.0/24"
  # serviceSubnet: "10.2.0.0/24"
  disableDefaultCNI: false
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /tmp/kind/pv
        containerPath: /tmp/kind/pv
  - role: worker
    extraMounts:
      - hostPath: /tmp/kind/pv
        containerPath: /tmp/kind/pv
  - role: worker
    extraMounts:
      - hostPath: /tmp/kind/pv
        containerPath: /tmp/kind/pv

